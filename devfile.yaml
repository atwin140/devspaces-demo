schemaVersion: 2.2.0

metadata:
  name: dastor-vm101
  displayName: DaSTOR OpenShift Virtualization 101
  description: OpenShift Virtualization hands-on lab workspace

components:
  - name: tools
    container:
      image: registry.redhat.io/devspaces/udi-rhel9:3.22-1753388504
      mountSources: true
      memoryRequest: 512Mi
      memoryLimit: 2Gi
      cpuRequest: 100m
      cpuLimit: 1000m
      env:
        - name: PATH
          value: /home/user/.local/bin:/usr/local/bin:/usr/bin:/bin
      volumeMounts:
        - name: cli-tools
          path: /home/user/.local/bin

  - name: cli-tools
    volume:
      size: 1Gi

commands:
  - id: install-virtctl
    exec:
      component: tools
      label: Install virtctl from the OpenShift cluster
      commandLine: |
        set -eu

        INSTALL_DIR="${HOME}/.local/bin"
        mkdir -p "${INSTALL_DIR}"
        export PATH="${INSTALL_DIR}:${PATH}"

        if [ -x "${INSTALL_DIR}/virtctl" ]; then
          echo "virtctl is already installed: ${INSTALL_DIR}/virtctl"
          exit 0
        fi

        for tool in oc jq curl tar install; do
          if ! command -v "$tool" >/dev/null 2>&1; then
            echo "ERROR: $tool is required but unavailable in this workspace." >&2
            exit 1
          fi
        done

        case "$(uname -m)" in
          x86_64) ARCH_LABEL=x86_64 ;;
          aarch64) ARCH_LABEL=arm64 ;;
          *) echo "ERROR: unsupported CPU architecture." >&2; exit 1 ;;
        esac

        TMP_DIR="$(mktemp -d)"
        trap 'rm -rf "$TMP_DIR"' EXIT

        echo "Finding the virtctl download for Linux ${ARCH_LABEL}..."
        if ! oc get consoleclidownload \
            virtctl-clidownloads-kubevirt-hyperconverged \
            -o json > "${TMP_DIR}/downloads.json"; then
          echo "ERROR: Cannot read the cluster's virtctl download information." >&2
          exit 1
        fi

        URL="$(jq -r --arg arch "$ARCH_LABEL" '
          [.spec.links[]
            | select(.text | test("Linux"; "i"))
            | select(.text | contains($arch))
            | .href] | first // empty
          ' "${TMP_DIR}/downloads.json")"

        if [ -z "$URL" ]; then
          echo "ERROR: No Linux ${ARCH_LABEL} virtctl link found." >&2
          exit 1
        fi

        echo "Downloading virtctl from the DaSTOR cluster..."
        curl --fail --location --silent --show-error \
          --retry 3 --output "${TMP_DIR}/virtctl.tar.gz" "$URL"

        tar -xzf "${TMP_DIR}/virtctl.tar.gz" -C "$TMP_DIR"
        BINARY="$(find "$TMP_DIR" -type f -name virtctl -print -quit)"
        if [ -z "$BINARY" ]; then
          echo "ERROR: virtctl executable not found in the downloaded archive." >&2
          exit 1
        fi

        install -m 0755 "$BINARY" "${INSTALL_DIR}/virtctl"
        "${INSTALL_DIR}/virtctl" --help >/dev/null
        echo "SUCCESS: virtctl installed at ${INSTALL_DIR}/virtctl"

  - id: verify-tools
    exec:
      component: tools
      label: Verify DaSTOR VM Lab Tools
      commandLine: |
        for tool in oc kubectl virtctl curl jq git bash; do
          if command -v "$tool" >/dev/null 2>&1; then
            echo "[OK] $tool"
          else
            echo "[MISSING] $tool"
          fi
        done

  - id: verify-cluster
    exec:
      component: tools
      label: Verify OpenShift Access
      commandLine: |
        oc whoami
        oc version
        oc get storageclass
        oc auth can-i create virtualmachines.kubevirt.io

  - id: list-vms
    exec:
      component: tools
      label: List Virtual Machines
      commandLine: oc get vm -A

  - id: list-storage
    exec:
      component: tools
      label: List Storage Classes
      commandLine: oc get storageclass

  - id: lab-status
    exec:
      component: tools
      label: Check VM Lab
      commandLine: oc get vm,vmi,pod,pvc,dv

events:
  postStart:
    - install-virtctl
